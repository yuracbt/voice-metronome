plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chobotok.voicemetronome'
    compileSdk 34

    defaultConfig {
        applicationId "com.chobotok.voicemetronome"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
